spring.application.name=payment-processing-system

##DATABASE CONFIGURATION##
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_processing
spring.datasource.username=postgres
spring.datasource.password=redhat
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Server port (optional — 8080 is default, only needed if you want to change it)
server.port=8081

# Show more readable SQL formatting in logs (makes show-sql output easier to read)
spring.jpa.properties.hibernate.format_sql=true

# Logging level for your own package (helpful for debugging as your app grows)
logging.level.com.abw=DEBUG

# Logging level for Hibernate SQL (shows bind parameter values, not just ?,?,?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.servlet.SecurityAutoConfiguration